<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreditLens — התחברות</title>
<link rel="icon" href="/static/creditlens.ico">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;font:14px/1.5 "Segoe UI","Heebo",system-ui,Arial,sans-serif;
       background:linear-gradient(135deg,#0c1a3a 0%,#13275c 55%,#1d4ed8 130%);color:#101828}
  .card{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(4,12,40,.45);width:400px;max-width:92vw;padding:40px 38px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .brand-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2e5cff,#7aa5ff);display:grid;place-items:center}
  .brand-name{font-size:22px;font-weight:800}
  .brand-name span{color:#1d4ed8}
  .subtitle{color:#667085;font-size:13px;margin-bottom:28px}
  label{display:block;font-size:12px;font-weight:600;color:#667085;margin:14px 0 6px}
  input{width:100%;border:1px solid #d0d7e2;border-radius:9px;padding:12px 14px;font-size:14.5px;font-family:inherit;background:#fcfdff}
  input:focus{outline:none;border-color:#1d4ed8;box-shadow:0 0 0 3.5px rgba(29,78,216,.12)}
  button{width:100%;margin-top:22px;background:#1d4ed8;color:#fff;border:0;border-radius:9px;padding:13px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){background:#1e40af}
  button:disabled{opacity:.65}
  .error{background:#fef3f2;border:1px solid #fecdca;color:#b42318;border-radius:9px;padding:11px 14px;font-size:13px;margin-top:16px;display:none}
  .error.show{display:block}
  .demo-hint{margin-top:24px;padding-top:18px;border-top:1px solid #eef1f6;font-size:11.5px;color:#98a2b3;line-height:1.8}
  .demo-hint code{background:#f2f4f7;border-radius:5px;padding:1px 7px;color:#475467;font-size:11px}
</style>
</head>
<body>
<form class="card" id="login-form">
  <div class="brand">
    <div class="brand-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12l5-5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    <div class="brand-name">Credit<span>Lens</span></div>
  </div>
  <div class="subtitle">מערכת החלטות אשראי — כניסה למשתמשים מורשים בלבד. כל פעולה נרשמת ביומן הביקורת.</div>

  <label for="username">שם משתמש</label>
  <input id="username" autocomplete="username" required autofocus>

  <label for="password">סיסמה</label>
  <input id="password" type="password" autocomplete="current-password" required>

  <button type="submit" id="submit">כניסה למערכת</button>
  <div class="error" id="error"></div>

  <div class="demo-hint">
    משתמשי הדגמה — חתם: <code>dan.k / Loan!2026</code> ·
    מנהלת סיכונים: <code>rachel.r / Risk!2026</code> ·
    אדמין: <code>admin / Admin!2026</code>
  </div>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const err = document.getElementById('error');
  btn.disabled = true; err.classList.remove('show');
  try {
    const r = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('username').value,
                            password: document.getElementById('password').value})});
    const d = await r.json();
    if (!r.ok) throw Error(d.error || 'שגיאת התחברות');
    location.href = '/';
  } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
