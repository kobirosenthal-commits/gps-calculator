name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GPS_CALCULATOR_NO_WORKERS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application modules
        run: python -m compileall -q app.py gps_core.py main.py refresh_data.py validate_app.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify import has no refresh side effects
        run: |
          python -c "import threading, app; assert not any(t.name.startswith('gps-') for t in threading.enumerate())"
